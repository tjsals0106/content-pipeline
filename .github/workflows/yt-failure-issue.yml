name: yt-failure-issue

# 업로드·공개·keepalive 워크플로가 실패하면 호출되어 GitHub 이슈를 연다.
# 같은 워크플로의 실패 이슈가 이미 열려 있으면 새 이슈 대신 댓글로 실행 링크를 덧붙인다.
# 본문에는 실행 링크·이벤트·커밋만 넣는다(토큰·개인정보 없음). 원인은 실행 로그에서 확인한다.
on:
  workflow_call:

permissions:
  issues: write

jobs:
  open-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 실패 이슈 생성 또는 댓글
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          title="[yt] ${WORKFLOW} 실패"
          body="- 실행: ${RUN_URL}
          - 이벤트: ${EVENT}
          - 커밋: ${SHA}

          실행 로그와 Step Summary에서 원인을 확인한다. 해결 후 이 이슈를 닫는다."
          number=$(gh issue list --state open --search "in:title \"${title}\"" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "${body}"
            echo "기존 이슈 #${number}에 댓글 추가"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
