name: yt-publish

# 매주 금요일 21:17 KST(12:17 UTC)에 공개 주차가 된 unlisted 영상을 public으로 전환하고 published_at을 커밋한다.
# 이미 public인 영상은 videos.update 없이 기록만 한다.
# cron 실행은 저장소 변수 YT_PUBLISH_ENABLED=true일 때만 실제 전환하고, 그 전에는 dry_run으로 대상만 출력한다.
# 운영 시작은 사용자가 업로드 테스트를 마친 뒤 이 변수를 true로 설정해 켠다.
on:
  schedule:
    - cron: '17 12 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true면 공개 대상만 출력 (videos.update와 기록 없음)'
        type: boolean
        default: true

permissions:
  contents: write

# 그룹당 대기 실행은 1개만 남으므로 업로드·공개 그룹을 분리한다(push가 금요일 공개 대기 실행을 취소하지 않도록).
# 두 워크플로가 기록하는 매니페스트는 겹치지 않고(youtube_id 없음 / 있음), 동시 push로 거부되면 push-manifests.sh가 pull --rebase 후 최대 3회 재시도한다.
concurrency:
  group: yt-publish
  cancel-in-progress: false

jobs:
  publish:
    # 매니페스트 기록은 main에만 커밋한다. main 이외 ref에서 시작하면 잡을 건너뛴다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ github.event_name == 'schedule' && vars.YT_PUBLISH_ENABLED != 'true' || github.event_name != 'schedule' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scripts/yt/package-lock.json

      - run: npm ci
        working-directory: scripts/yt

      - name: 공개 전환
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SEONMINMOV_REFRESH_TOKEN: ${{ secrets.YT_SEONMINMOV_REFRESH_TOKEN }}
          YT_MELIV_REFRESH_TOKEN: ${{ secrets.YT_MELIV_REFRESH_TOKEN }}
          YT_VIRIDITAS_REFRESH_TOKEN: ${{ secrets.YT_VIRIDITAS_REFRESH_TOKEN }}
          YT_CHANNEL_ID_SEONMIN_MOV: ${{ vars.YT_CHANNEL_ID_SEONMIN_MOV }}
          YT_CHANNEL_ID_MELIV_MUSIC: ${{ vars.YT_CHANNEL_ID_MELIV_MUSIC }}
          YT_CHANNEL_ID_VIRIDITAS_WORSHIP: ${{ vars.YT_CHANNEL_ID_VIRIDITAS_WORSHIP }}
          PUBLISH_BATCH_SIZE: ${{ vars.PUBLISH_BATCH_SIZE }}
        run: node scripts/yt/publish.mjs

      # 일부 실패·쿼터 초과로 위 단계가 실패해도 이미 전환된 영상의 published_at은 커밋한다
      - name: 매니페스트 커밋
        if: ${{ always() && env.DRY_RUN == 'false' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/yt/push-manifests.sh 'videos: 공개 전환 기록 (published_at)'

  report-failure:
    needs: publish
    if: ${{ failure() }}
    permissions:
      issues: write
    uses: ./.github/workflows/yt-failure-issue.yml
